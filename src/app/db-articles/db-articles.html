<nz-layout class="comp-layout">
  <!-- Sidebar -->
  <nz-sider nzCollapsible nzWidth="180px" class="comp-sider">
    <div class="sider-header">Categories</div>
      <div
        class="sider-menu"
        [class.tree-disabled]="treeDisabled"
        role="navigation"
        aria-label="Sidebar menu scroll area"
      >
      <categories-tree />
    </div>
    <div class="sider-footer">
      <!-- Sider Footer -->
      <!-- <label
        nz-checkbox
        [(ngModel)]="unassignedOnly"
        (ngModelChange)="isOnlyUnassignedToggle()"
        >Unassigned</label
      > -->
      <nz-radio-group
        [(ngModel)]="articlesFilter"
        (ngModelChange)="onArticlesFilterChange($event)"
        nzSize="small"
      >
        <label nz-radio [nzValue]="'unassigned'">Unassigned Articles</label>
        <label nz-radio [nzValue]="'all'">All Articles</label>
        <label nz-radio [nzValue]="'byCategory'">By Category</label>
      </nz-radio-group>
    </div>
  </nz-sider>

  <!-- Content -->
  <nz-content class="comp-content">
    <div class="inner-content">
      <articles-table />
    </div>
  </nz-content>

  <!-- Footer -->
  <!-- <nz-footer class="app-footer">
    </nz-footer> -->
</nz-layout>
