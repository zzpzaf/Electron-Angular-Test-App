<!-- <p>modal-config works!</p> -->

<div class="config-container">
  <h2>Application Settings</h2>

  <div class="config-content">
    <form [formGroup]="settingsForm" (ngSubmit)="onSave()">
      <!-- 🔹 Field 1: sqliteFullPathName -->
      <div class="form-group">
        <label for="sqliteFullPathName">
          Full Path Name of the FireFox/Floorp 'places.sqlite' file:
        </label>

        <div class="input-button-row">
          <input
            nz-input
            id="sqliteFullPathName"
            formControlName="sqliteFullPathName"
            placeholder="Enter/Get Full pathname"
          />

          <button nz-button nzType="primary" type="button" (click)="onGetFile()">
            Get File...
          </button>
        </div>
      </div>

      <!-- 🔹 Field 2: outputFolder -->
      <div class="form-group">
        <label for="outputFolder">
          Output Folder for File(s) Saving:
        </label>

        <div class="input-button-row">
          <input
            nz-input
            id="outputFolder"
            formControlName="outputFolder"
            placeholder="Enter/Select Output Folder"
          />

          <button nz-button nzType="primary" type="button" (click)="onGetFolder()">
            Get Folder...
          </button>
        </div>
      </div>

      <!-- 🔹 Footer Buttons: Inside the <form> -->
      <div class="config-footer">
        <div class="buttons">
          <button 
          nz-button 
          nzType="primary" 
          [disabled]="isFormFieldsEmpty"
          type="button" 
          (click)="onClear()">
            Clear
          </button>
          <button 
          nz-button 
          nzType="primary" 
          type="button" 
          (click)="onClose()">
            Cancel
          </button>
          <button
            nz-button
            nzType="primary"
            [disabled]="settingsForm.invalid"
            type="submit"
          >
            Submit
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
