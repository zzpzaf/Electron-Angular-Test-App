<nz-layout class="comp-layout">
  <!-- Sidebar -->
  <nz-sider nzCollapsible nzWidth="180px" class="comp-sider">
    <div class="sider-header">Categories</div>

    <div
      class="sider-menu"
      [class.tree-disabled]="treeDisabled"  
      role="navigation"
      aria-label="Sidebar menu scroll area"
    >
      <!-- <ul>
        @for (cat of $categories(); track cat.id) {
          <li>{{ cat.name }}</li>
        }
      </ul> -->
      <nz-tree

        [nzData]="$treeNodes()"
        [nzExpandedKeys]="expandedKeys"
        [nzSelectedKeys]="selectedKeys"
        nzBlockNode
        (nzClick)="onTreeNodeClick($event)"

        (nzExpandChange)="onTreeNodeExpandChange($event)"
      >
        <!-- <ng-template #nzTreeTemplate let-node>
          <span class="tree-title">{{ node.title }}</span>
        </ng-template> -->
      </nz-tree>
    </div>

    <div class="sider-footer">
      <!-- Sider Footer -->
      <label
        nz-checkbox
        [(ngModel)]="unassignedOnly"
        (ngModelChange)="isOnlyUnassignedToggle()"
        >Unassigned</label
      >
    </div>
  </nz-sider>

  <!-- Header -->
  <!-- <nz-header class="comp-header">
      <div class="header-content">
      </div>
    </nz-header> -->

  <!-- Content -->
  <nz-content class="comp-content">
    <div class="inner-content">
      <!-- Router outlet for Angular pages -->
      <!-- <router-outlet></router-outlet> -->
    </div>
  </nz-content>

  <!-- Footer -->
  <!-- <nz-footer class="app-footer">
     
    </nz-footer> -->
</nz-layout>
