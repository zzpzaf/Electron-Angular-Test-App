<form
  nz-form
  nzLayout="inline"
  [formGroup]="linkScrapeForm"
  class="login-form"
  (ngSubmit)="submitForm()"
>
  <nz-form-item class="login-form-spacer"></nz-form-item>

  <nz-form-item class="login-form-input">
    <nz-form-control nzErrorTip="Please input the URL" nzExtra="Enter/type, paste or drop a List URL here, e.g. a Medium List URL">
      <nz-input-group>
        <input
          type="text"
          nz-input
          formControlName="url"
          placeholder="URL"
          (drop)="onDrop($event)"
          (dragover)="onDragOver($event)"
        />
      </nz-input-group>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <label nz-checkbox formControlName="add">
      <span>Add</span>
    </label>
  </nz-form-item>

  <nz-form-item>
    <button nz-button [nzType]="'primary'">Scrape</button>
  </nz-form-item>
</form>

<!-- @if (scrappedError().length > 0) {
<div class="error-message">
  <p>Error: {{ scrappedError() }}</p>
</div>
} -->

<!-- ------------------------------------------------- -->
<div class="login-form-separator"></div>
<!-- ------------------------------------------------- -->

<div class="text-area-container">
  <textarea
    nz-input
    [(ngModel)]="scrappedDataArrayString"
    class="stretch-textarea"
  ></textarea>

  <div class="button-container">

    <button nz-button nzType="primary"
      [disabled]="scrappedDataArrayString().length === 0  && linkURL().length === 0" 
      (click)="onClearScrappedData()">
      Clear
    </button>

    <button nz-button nzType="primary"
      [disabled]="scrappedDataArrayString().length === 0" 
      (click)="onCopyScrappedData()">
      Copy
    </button>

    <button
      nz-button
      nzType="primary"
      [disabled]="scrappedDataArrayString().length === 0" 
      (click)="onSaveScrappedData()"
    >
      Save
    </button>
  </div>

</div>
